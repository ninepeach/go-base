name: Core CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache-dependency-path: core/go.mod
      - name: Format check
        run: |
          test -z "$(gofmt -l core/*.go)"
      - name: Unit tests
        working-directory: core
        run: go test ./...
      - name: Race tests
        working-directory: core
        run: go test -race ./...
      - name: Vet
        working-directory: core
        run: go vet ./...
