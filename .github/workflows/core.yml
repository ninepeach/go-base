name: Core CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache-dependency-path: core/go.sum
      - name: Format check
        run: |
          test -z "$(gofmt -l core)"
      - name: go.mod and go.sum are tidy
        working-directory: core
        run: go mod tidy -diff
      - name: Unit tests
        working-directory: core
        run: go test -count=1 ./...
      - name: Race tests
        working-directory: core
        run: go test -race -count=1 ./...
      - name: Vet
        working-directory: core
        run: go vet ./...
