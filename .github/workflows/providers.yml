name: Provider CI
on:
  push:
    branches: [main]
    paths:
      - 'postgres/**'
      - 'redis/**'
      - 'mailer/**'
      - 's3/**'
      - 'media/**'
      - 'core/**'
      - 'go.work'
      - '.github/workflows/providers.yml'
  pull_request:
jobs:
  providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      - name: Format check
        run: |
          test -z "$(gofmt -l postgres/*.go redis/*.go mailer/*.go s3/*.go media/*.go)"
      - name: Prepare dependency checksums
        run: |
          for mod in postgres redis mailer s3 media; do
            (cd "$mod" && GOWORK=off go mod tidy)
          done
      - name: Tests, race detector and vet
        run: |
          for mod in postgres redis mailer s3 media; do
            (cd "$mod" && GOWORK=off go test ./... && GOWORK=off go test -race ./... && GOWORK=off go vet ./...)
          done
