name: Provider CI
on:
  push:
    branches: [main]
    paths:
      - 'postgres/**'
      - 'redis/**'
      - 'mailer/**'
      - 's3/**'
      - 'media/**'
      - 'core/**'
      - 'go.work'
      - '.github/workflows/providers.yml'
  pull_request:
jobs:
  providers:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 2s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      GOWORK: 'off'
      POSTGRES_TEST_DSN: postgres://test:test@localhost:5432/test?sslmode=disable
      MEDIA_TEST_DSN: postgres://test:test@localhost:5432/test?sslmode=disable
      REDIS_TEST_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache-dependency-path: '*/go.sum'
      - name: Format check
        run: |
          test -z "$(gofmt -l postgres redis mailer s3 media)"
      - name: go.mod and go.sum are tidy
        run: |
          for mod in postgres redis mailer s3 media; do
            (cd "$mod" && go mod tidy -diff)
          done
      - name: Vet, tests and race detector (integration tests use the services above)
        run: |
          for mod in postgres redis mailer s3 media; do
            (cd "$mod" && go vet ./... && go test -race -count=1 ./...)
          done
